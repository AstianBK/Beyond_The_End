
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }

    dependencies {
        classpath group: 'net.minecraftforge.gradle',
                name: 'ForgeGradle',
                version: '5.1.+',
                changing: true

        classpath 'org.parchmentmc:librarian:1.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "beyondtheend.refmap.json"
}

jarJar.enable()

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"


// ==========================================================
// CONFIGURACIONES
// ==========================================================

configurations {
    javacvRaw
    ffmpegNatives
}
tasks.register('stripJavacv', Zip) {
    archiveFileName = 'javacv-1.5.9.jar'
    destinationDirectory = layout.buildDirectory.dir('stripped')

    from {
        zipTree(configurations.javacvRaw.singleFile)
    }

    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'
}
// Directorio donde se extraen las DLL de Windows
def nativeDir = layout.buildDirectory.dir('ffmpeg-natives')


// ==========================================================
// MINECRAFT / FORGE
// ==========================================================

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file(
            'src/main/resources/META-INF/accesstransformer.cfg'
    )

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            // Buscar primero las DLL ya extraídas
// Priorizar las bibliotecas extraídas
            property 'org.bytedeco.javacpp.pathsFirst', 'true'

// Indicar explícitamente dónde están las DLL
            property 'org.bytedeco.javacpp.platform.preloadpath',
                    nativeDir.get().asFile.absolutePath

            property 'org.bytedeco.javacpp.platform.linkpath',
                    nativeDir.get().asFile.absolutePath

            // Permitir que Windows encuentre DLL dependientes
            environment 'PATH',
                    "${nativeDir.get().asFile.absolutePath};${System.getenv('PATH')}"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            arg "-mixin.config=beyondtheend.mixins.json"
            property "mixin.env.remapRefMap", "true"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property "mixin.env.remapRefMap", "true"

            arg "-mixin.config=beyondtheend.mixins.json"
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}


// ==========================================================
// RECURSOS
// ==========================================================

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}


// ==========================================================
// REPOSITORIOS
// ==========================================================

repositories {
    mavenCentral()

    maven {
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }

    maven {
        url 'https://cursemaven.com'

        content {
            includeGroup "curse.maven"
        }
    }
}


// ==========================================================
// DEPENDENCIAS
// ==========================================================

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.19:3.1.40')

    // JavaCV original, para eliminar module-info
    javacvRaw('org.bytedeco:javacv:1.5.9') {
        transitive = false
    }

    // JavaCPP
    minecraftLibrary 'org.bytedeco:javacpp:1.5.9'
    minecraftLibrary 'org.bytedeco:javacpp:1.5.9:windows-x86_64'

    // FFmpeg
    minecraftLibrary 'org.bytedeco:ffmpeg:6.0-1.5.9'
    minecraftLibrary 'org.bytedeco:ffmpeg:6.0-1.5.9:windows-x86_64'

    // Dependencias para extraer DLL nativas
    ffmpegNatives('org.bytedeco:javacpp:1.5.9:windows-x86_64') {
        transitive = false
    }

    ffmpegNatives('org.bytedeco:ffmpeg:6.0-1.5.9:windows-x86_64') {
        transitive = false
    }

    // Jar-in-Jar
    jarJar(
            group: 'org.bytedeco',
            name: 'javacpp',
            version: '[1.5.9,1.6)'
    )

    jarJar(
            group: 'org.bytedeco',
            name: 'javacpp',
            version: '[1.5.9,1.6)',
            classifier: 'windows-x86_64'
    )

    jarJar(
            group: 'org.bytedeco',
            name: 'ffmpeg',
            version: '[6.0-1.5.9,6.1)'
    )

    jarJar(
            group: 'org.bytedeco',
            name: 'ffmpeg',
            version: '[6.0-1.5.9,6.1)',
            classifier: 'windows-x86_64'
    )

    // JavaCV sin module-info
    minecraftLibrary files(
            tasks.named('stripJavacv').map { it.archiveFile }
    )

}



tasks.register('extractFfmpegNatives', Copy) {
    from {
        configurations.ffmpegNatives.collect { zipTree(it) }
    }

    include '**/windows-x86_64/*.dll'

    eachFile { details ->
        details.path = details.name
    }

    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    into nativeDir
}

// Ejecutar la extracción antes de iniciar Minecraft
tasks.matching {
    it.name == 'runClient'
}.configureEach {
    dependsOn 'extractFfmpegNatives'
}


// ==========================================================
// PROCESS RESOURCES
// ==========================================================

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}


// ==========================================================
// JAR SLIM
// ==========================================================

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'

    manifest {
        attributes([
                'Specification-Title'       : mod_id,
                'Specification-Vendor'      : mod_authors,
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : project.jar.archiveVersion,
                'Implementation-Vendor'     : mod_authors,
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'              : mod_id + ".mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}


// ==========================================================
// JAR FINAL
// ==========================================================

tasks.named('jarJar').configure {
    archiveClassifier = ''

    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.version,
                'MixinConfigs'            : mod_id + ".mixins.json"
        ])
    }

    from({
        zipTree(
                tasks.named('stripJavacv')
                        .get()
                        .archiveFile
                        .get()
                        .asFile
        )
    }) {
        exclude 'META-INF/MANIFEST.MF'
    }

    dependsOn 'stripJavacv'
    finalizedBy 'reobfJarJar'
}

reobf {
    jarJar {}
}

tasks.named('build') {
    dependsOn 'jarJar'
}


// ==========================================================
// PUBLICACIÓN
// ==========================================================

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}


// ==========================================================
// COMPILACIÓN
// ==========================================================

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
